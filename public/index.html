<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17133c" />
  <meta name="description" content="Spot Sprint: the live, picture-matching classroom race. Join with a code, find the match and be first to clear your cards." />
  <title>Spot Sprint · Classroom Picture-Matching Race</title>
  <link rel="stylesheet" href="/style.css?v=20261015-20" />
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>
  <div class="bg-orb orb-c" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Spot Sprint home">
        <img class="brand-complete-logo" src="/spot-sprint-wordmark.webp?v=20261015-20" alt="Spot Sprint" />
      </a>
      <div id="teacher-header-info" class="teacher-header-info" hidden></div>
      <div id="student-header-info" class="student-header-info" hidden></div>
      <div class="header-right">
        <span id="connection" class="connection" aria-live="polite"><span class="live-dot"></span>Connecting</span>
        <button id="music-btn" class="soft-btn music-btn" type="button" data-action="music" aria-label="Toggle background music" hidden>🎵 <span>Music on</span></button>
        <button id="fullscreen-btn" class="soft-btn fullscreen-btn" type="button" data-action="fullscreen" aria-label="Toggle full screen" aria-pressed="false">⛶ <span>Full screen</span></button>
        <div id="teacher-header-actions" class="teacher-header-actions" hidden></div>
      </div>
    </header>
    <div id="alert" class="toast" role="status" aria-live="polite"></div>
    <main id="screen" class="screen" aria-live="off"></main>
    <footer class="site-footer">Find the one picture that matches. Quick eyes win. <span>✦</span> Made for real classrooms.</footer>
  </div>
  <script src="/realtime.js?v=20261015-20"></script>
  <script src="/app.js?v=20261015-20"></script>
</body>
</html>
