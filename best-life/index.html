e{width:100%}.pill{font-size:12px;color:#c8d8ee;background:#233550;border-radius:100px;padding:6px 9px}.periods{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:2px 0}.periods button{white-space:nowrap;background:#17263d;border:1px solid #283b55;padding:9px 11px;border-radius:11px;color:#bdd0e4;font-size:12px}.periods button.active{background:#a4e7ef;color:#092434;font-weight:800}.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.area{border:1px solid var(--line);background:linear-gradient(#16263f,#0e1a2b);padding:12px 7px;border-radius:18px;text-align:center;color:white;min-width:0}.area .name{font-size:11px;font-weight:750;min-height:32px}.area svg{width:64px;height:64px;max-width:100%;display:block;margin:0 auto 7px}.area .rate{font-size:19px;font-weight:800}.area .micro{font-size:10px;color:#a3b7ce}.area.selected{border-color:#83d8e5}.bar{background:#2b3950;border-radius:100px;overflow:hidden;height:9px}.bar>div{height:100%;background:var(--green);border-radius:100px;transition:width .35s}.bar.warn>div{background:var(--amber)}.bar.danger>div{background:var(--red)}.routines{display:grid;gap:11px}.routine{border-radius:15px;background:#182840;border:1px solid #283b53;padding:13px}.routine.done{border-color:#277d65}.routine.warn{border-color:#8d692f}.routine.danger{border-color:#995062}.rtitle{font-size:15px;font-weight:710}.actions{display:flex;gap:7px;align-items:center}.round{height:33px;width:33px;border-radius:10px;border:1px solid #4e647f;background:#253952;color:white;font-weight:900;font-size:18px}.round.add{background:#216c56;color:#cdffed;border-color:#37ae85}.label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.field{width:100%;border:1px solid #39506b;background:#0b1728;color:#fff;border-radius:12px;padding:12px;margin-bottom:14px}.days{display:flex;gap:6px;justify-content:space-between}.day{width:36px;height:36px;border-radius:50%;border:1px solid #3d5470;color:#b6c9db;background:#1b2b44}.day.active{background:#37dca2;color:#06291f;border-color:#37dca2}.separator{height:1px;background:var(--line);margin:12px 0}.nav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:640px;display:grid;grid-template-columns:repeat(4,1fr);background:#101d31;border-top:1px solid #31415a;padding:9px 7px max(12px,env(safe-area-inset-bottom));z-index:9}.nav button{background:none;border:0;color:#9bafc7;display:grid;justify-items:center;gap:2px;font-size:11px;padding:5px}.nav button.on{color:#7ef2c1}.nav .nicon{font-size:22px}dialog{background:#102039;color:white;border:1px solid #3b536f;border-radius:22px;padding:20px;width:min(94vw,500px);max-height:85dvh;overflow:auto}dialog::backdrop{background:#000a}.quote{font-size:18px;line-height:1.5;font-style:italic}.spark{color:#ffe09e;font-weight:800}.chart{display:flex;align-items:flex-end;gap:5px;height:125px;border-bottom:1px solid #476078;padding:9px 2px 0}.chartbar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}.chartbar span{width:100%;border-radius:4px 4px 0 0;min-height:1px}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#bbcfe1}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.miniRow{display:flex;gap:7px;align-items:center}.badge{background:#1d483d;color:#97ffd4;padding:5px 8px;border-radius:9px;font-size:11px}.empty{text-align:center;color:#a6bad1;padding:25px 10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{font-size:28px;font-weight:830}.streak{background:#413020;color:#ffe0a5}.checkline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #293a52}.checkline:last-child{border-bottom:0}.checkline button{min-width:39px}.notice{border-radius:12px;padding:12px;background:#253953;color:#daebf9;font-size:12px;line-height:1.45}#toast{position:fixed;z-index:20;left:50%;bottom:85px;transform:translateX(-50%);background:#d1ffed;color:#0a3028;border-radius:12px; /* User-selectable appearance: preserves existing layout and category accents. */
.theme-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-choice{padding:13px 9px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--txt);font-weight:750}
.theme-choice.active{border-color:#20ad8c;box-shadow:0 0 0 2px #20ad8c45}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f7fd;--panel:#ffffff;--panel2:#e8f0fa;--line:#d5e0ed;--txt:#14263e;--muted:#52657d;--green:#159568;--amber:#b87414;--purple:#7955ca;--red:#c74459}
:root[data-theme="light"] body{background:#f3f7fd}
:root[data-theme="light"] .card{background:linear-gradient(155deg,#fff,#f5f9fe);box-shadow:0 3px 12px #36567909}
:root[data-theme="light"] .hero{background:radial-gradient(circle at 100% 0%,#d1ebf2 0%,transparent 48%),linear-gradient(145deg,#edf5ff,#fff)}
:root[data-theme="light"] .eyebrow{color:#087e82}
:root[data-theme="light"] .iconbtn,:root[data-theme="light"] .ghost{background:#e8f0f9;color:var(--txt);border-color:#cbd8e8}
:root[data-theme="light"] .secondary{background:#e5eef9;color:#162f49;border-color:#cbd8ea}
:root[data-theme="light"] .pill{color:#36536e;background:#e5edf8}
:root[data-theme="light"] .periods button{background:#e7eef9;border-color:#cdd9e8;color:#38516d}
:root[data-theme="light"] .periods button.active{background:#137f89;color:white}
:root[data-theme="light"] .area{background:linear-gradient(#fff,#f2f7fe);color:var(--txt)}
:root[data-theme="light"] .area .micro{color:#536985}
:root[data-theme="light"] .bar{background:#dce6f1}
:root[data-theme="light"] .routine{background:#f1f6fd;border-color:#d3deeb}
:root[data-theme="light"] .round{background:#e4eef8;border-color:#cbd8e9;color:#15344c}
:root[data-theme="light"] .round.add{background:#d1f9e7;border-color:#8bdcb8;color:#056844}
:root[data-theme="light"] .field{background:#fff;border-color:#c5d3e4;color:#14263e}
:root[data-theme="light"] .day{background:#edf3fa;border-color:#c8d7e8;color:#35536d}
:root[data-theme="light"] .day.active{background:#159568;color:#fff;border-color:#159568}
:root[data-theme="light"] .nav{background:#ffffff;border-color:#d6e0ec}
:root[data-theme="light"] .nav button{color:#60738c}
:root[data-theme="light"] .nav button.on{color:#08836b}
:root[data-theme="light"] dialog{background:#fff;color:var(--txt);border-color:#cdd9e8}
:root[data-theme="light"] .legend{color:#536b82}
:root[data-theme="light"] .badge{background:#d7f4e5;color:#096c4b}
:root[data-theme="light"] .empty{color:#61768b}
:root[data-theme="light"] .streak{background:#fff0d7;color:#81530a}
:root[data-theme="light"] .checkline{border-color:#d7e2ed}
:root[data-theme="light"] .notice{background:#e7f0fa;color:#29445c}
:root[data-theme="light"] .danger{color:#b7334e}
:root[data-theme="light"] .area svg circle:first-child{stroke:#dce6ef}

/* Artwork integrated from the approved original AI-generated concept */

function active(r,day){return day>=r.created&&(!r.archived||day<r.archived)}
function completed(r,start,end){return db.completions.filter(c=>c.rid===r.id&&c.date>=start&&c.date<=end).length}
function weeklyGoal(r,w){if(!active(r,add(w,6))&&!active(r,w))return null;return targetAt(r,add(w,6))}
function rollup(area,start,end){let total=0,actual=0;const w0=weekStart(start);for(let w=w0;w<=end;w=add(w,7)){let finish=add(w,6);let segS=w<start?start:w,segE=finish>end?end:finish;for(let r of db.routines){if(area&&r.area!==area)continue;let t=weeklyGoal(r,w);if(t===null)continue;let activeDays=0;for(let d=segS;d<=segE;d=add(d,1))if(active(r,d))activeDays++;if(!activeDays)continue;let allowed=(w===weekStart(today()) && segE===today() && segS===w)?t:Math.min(t,Math.max(1,Math.round(t*activeDays/7)));total+=allowed;actual+=Math.min(allowed,completed(r,segS,segE));}}return{total,actual,pct:total?Math.round(actual/total*100):0}}
function single(r){let w=weekStart(today()),t=targetAt(r,today())||r.target,c=completed(r,w,today()),daysLeft=7-((from(today()).getDay()+6)%7)-1;let missing=Math.max(0,t-c),severity=c>=t?'done':missing>daysLeft+1?'danger':missing>daysLeft&&daysLeft<=2?'warn':'';return {t,c,missing,severity,pct:Math.min(100,Math.round(c/t*100))}}
function ring(p,color,label){let r=34,c=2*Math.PI*r;return `<svg viewBox="0 0 90 90" role="img" aria-label="${escape(label)} ${p}%"><circle cx="45" cy="45" r="34" fill="none" stroke="#31425d" stroke-width="9"/><circle cx="45" cy="45" r="34" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 45 45)"/><text x="45" y="51" fill="var(--txt)" font-weight="800" font-size="18" text-anchor="middle">${p}%</text></svg>`}
function periods(){return `<div class="periods">${Object.entries(periodNames).map(([id,name])=>`<button class="${id===period?'active':''}" data-period="${id}">${name}</button>`).join('')}</div>`}
function header(title){return title?`<header><div class="brand">${escape(title)}</div></header>`:'' }
function nav(){return `<div class="nav">${[['home','⌂','Home'],['checkin','☑','Check-in'],['stats','▥','Insights'],['settings','⚙','Settings']].map(x=>`<button data-nav="${x[0]}" class="${view===x[0]?'on':''}"><span class="nicon">${x[1]}</span>${x[2]}</button>`).join('')}</div>`}
function miniQuote(){let idx=Math.max(0,Math.floor((from(today())-from('2026-01-01'))/86400000));let q=(window.DAILY_SPARKS||[])[((idx%500)+500)%500];return q||{text:'Small steps shape a meaningful life.',author:'Aaron’s Best Life · Original reflection',area:'mind'}}
function home(){let [s,e]=interval(),r=rollup(null,s,e),q=miniQuote(),w=weekStart(today());return `${header('',false)}<div class="stack"><button class="primary wide" data-nav="checkin" style="font-size:17px;padding:17px">☑ Today’s check-in</button><div class="card hero stack"><div class="line"><h2>Weekly progress</h2><img class="brand-symbol" src="./icon.svg" alt="" width="66" height="66"></div><div class="line"><div class="stats">${r.pct}%</div><span class="pill">${r.actual} / ${r.total} completions</span></div><div class="bar"><div style="width:${r.pct}%"></div></div></div>${periods()}<div class="areas">${areas.map(a=>{let z=rollup(a.id,s,e);return `<button class="area" data-area="${a.id}" aria-label="Open ${a.name}"><img class="area-art" src="assets/${a.art}" alt="" loading="lazy">${ring(z.pct,a.color,a.short)}<div class="name">${a.name}</div><div class="rate">${z.pct}%</div><div class="micro">View routines →</div></button>`}).join('')}</div><div class="card stack"><div class="line"><h3>Weekly intention</h3><button class="ghost small" data-modal="intention">Edit</button></div><p class="sub">${escape(db.intentions[w]||'Add your intention for the week')}</p></div><div class="card stack"><h3>Daily inspiration</h3><p class="quote">“${escape(q.text)}”</p><div class="small muted">${escape(q.author)}</div></div><button class="secondary wide" data-modal="reflection">Weekly reflection</button></div>`}
function achievements(){let done=db.completions.length;let w=weekStart(today());let complete=areas.every(a=>{let x=rollup(a.id,w,today());return x.total>0&&x.actual>=x.total});return `<div class="twocol"><div class="notice">⭐ <b>${complete?'Balanced week achieved!':'Balanced life'}</b><br>Meet targets in all 3 life areas.</div><div class="notice">🔥 <b>${done} total check-ins</b><br>${done>=100?'100 completions reached!':'Every action counts.'}</div></div>`}
function routineRow(r,editable=true){let x=single(r),color=x.severity==='done'?'done':x.severity;let note=x.severity==='done'?'Weekly goal complete':x.severity==='danger'?'⚠ At risk this week':x.severity==='warn'?'Almost out of time':'Keep it going';return `<div class="routine ${color}"><div class="line"><div style="flex:1;min-width:0"><div class="rtitle">${escape(r.name)} </div><div class="small muted">${x.c} of ${x.t} this week ${r.days?.length?' · '+r.days.map(i=>'MTWTFSS'[i]).join(''):''}</div></div><div class="actions"><button class="round" data-adjust="-1" data-id="${r.id}" title="Undo latest completion">−</button><button class="round add" data-adjust="1" data-id="${r.id}" title="Mark completion">+</button>${editable?`<button class="ghost" data-edit="${r.id}" title="Edit routine">⋯</button>`:''}</div></div><div class="bar ${x.severity}" style="margin-top:10px"><div style="width:${x.pct}%"></div></div><div class="tiny muted" style="margin-top:7px">${note}${r.notes?' · '+escape(r.notes):''}</div></div>`}
function category(){let a=areas.find(x=>x.id===selected),rs=db.routines.filter(r=>r.area===selected&&!r.archived);let [s,e]=interval(),x=rollup(a.id,s,e);return `${header(a.name,true)}<div class="stack"><div class="card hero line"><div class="category-mark"><img src="assets/${a.art}" alt="" class="area-art">${ring(x.pct,a.color,a.short)}</div><div style="flex:1"><h2>${periodNames[period]}</h2><p class="sub">${x.actual} of ${x.total} target completions</p></div></div>${periods()}<div class="line"><h2>My routines</h2><span class="pill">${rs.length} active</span></div><div class="routines">${rs.length?rs.map(r=>routineRow(r)).join(''):'<div class="empty card">Your journey starts with one routine. Add something meaningful below.</div>'}</div><button class="primary wide" data-add="${selected}">＋ Add new routine</button><div class="notice">Tap + to mark a completion (even more than once today). Tap − to undo today's latest completion.</div></div>`}
function checkin(){let rs=db.routines.filter(r=>!r.archived&&active(r,today())&&(filter==='all'||r.area===filter));return `${header('Today’s check-in',true)}<div class="stack"><div class="sub">${from(today()).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="periods">${[['all','All'],...areas.map(a=>[a.id,a.short])].map(([id,n])=>`<button class="${id===filter?'active':''}" data-filter="${id}">${n}</button>`).join('')}</div>${rs.length?rs.map(r=>`<div class="card stack"><div class="line"><div><div class="rtitle">${escape(r.name)}</div><div class="small muted">${escape(areas.find(a=>a.id===r.area).name)} · ${single(r).c}/${r.target} this week</div></div><div class="actions"><button class="round" data-adjust="-1" data-id="${r.id}">−</button><button class="round add" data-adjust="1" data-id="${r.id}">+</button></div></div><div class="bar"><div style="width:${single(r).pct}%"></div></div><div class="small muted">${db.completions.filter(c=>c.rid===r.id&&c.date===today()).length} recorded today</div></div>`).join(''):'<div class="empty card">No routines here yet. Add one in a life area.</div>'}<button class="secondary wide" data-nav="home">Back to dashboard</button></div>`}
function stats(){let [s,e]=interval(),ws=weekStart(e);let weeks=[];for(let w=weekStart(s);w<=e;w=add(w,7)){let row={week:w};for(let a of areas)row[a.id]=rollup(a.id,w,add(w,6)>e?e:add(w,6)).pct;weeks.push(row)}if(weeks.length>24)weeks=weeks.filter((_,i)=>i%Math.ceil(weeks.length/24)===0||i===weeks.length-1);let counts=db.completions.filter(c=>c.date>=s&&c.date<=e).length;return `${header('Progress & insights',true)}<div class="stack">${periods()}<div class="card stack"><h2>My progress over time</h2><p class="sub">Percentage of routine targets met by week</p><div class="chart" aria-label="Weekly completion chart">${weeks.map(x=>`<div class="chartbar" title="Week of ${x.week}: Fitness ${x.fitness}%, Family ${x.family}%, Mind ${x.mind}%">${areas.slice().reverse().map(a=>`<span style="height:${Math.max(1,x[a.id])/3}%;background:${a.color}"></span>`).join('')}</div>`).join('')}</div><div class="legend">${areas.map(a=>`<span><i class="dot" style="background:${a.color}"></i>${a.short}</span>`).join('')}</div><p class="tiny muted">Each clustered bar represents a week. Hover or long-press for percentages.</p></div><div class="twocol"><div class="card"><div class="eyebrow">Completions</div><div class="stats">${counts}</div></div><div class="card"><div class="eyebrow">Success rate</div><div class="stats">${rollup(null,s,e).pct}%</div></div></div><div class="card stack"><h3>Life area breakdown</h3>${areas.map(a=>{let x=rollup(a.id,s,e);return `<div><div class="line small"><b>${a.name}</b><span>${x.pct}%</span></div><div class="bar" style="margin-top:7px"><div style="width:${x.pct}%;background:${a.color}"></div></div></div>`}).join('')}</div><div class="card stack"><h3>Weekly reflections</h3>${Object.entries(db.reflections).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8).map(([w,r])=>`<div class="notice"><b>${dateFmt(w)}</b><br>✓ ${escape(r.good)}<br>↗ ${escape(r.improve)}</div>`).join('')||'<p class="sub">Your reflections will appear here.</p>'}</div></div>`}
function settings(){return `${header('Settings',true)}<div class="stack"><div class="card stack"><h3>🎨 Appearance</h3><p class="sub">Choose how Aaron’s Best Life looks on your phone.</p><div class="theme-options" role="group" aria-label="Appearance"><button type="button" data-theme="dark" class="theme-choice ${db.settings.theme==='dark'?'active':''}" aria-pressed="${db.settings.theme==='dark'}">🌙 Dark mode</button><button type="button" data-theme="light" class="theme-choice ${db.settings.theme==='light'?'active':''}" aria-pressed="${db.settings.theme==='light'}">☀️ Light mode</button></div></div><div class="card stack"><h3>🔔 Evening check-in reminder</h3><p class="sub">9:00 pm, every day</p><label class="miniRow"><input type="checkbox" id="reminder" ${db.settings.reminder?'checked':''}> Show an in-app 9 pm reminder when the app is open</label><div class="notice">Important: this web app cannot reliably play an alert at 9 pm when closed. For a guaranteed phone alert, set a repeating 9 pm reminder in your phone’s Clock app. Installing a native version can improve notification support.</div><button class="secondary wide" id="testSound">🔊 Test alert sound</button></div><div class="card stack"><h3>💾 Your data</h3><p class="sub">Your progress is saved on this device, not uploaded to a server. Browser data clearing can erase it. Make regular backups.</p><button class="primary wide" id="export">Export backup (.json)</button><label class="secondary wide" style="text-align:center;cursor:pointer">Import backup <input id="import" type="file" accept="application/json" hidden></label></div><div class="card stack"><h3>📅 Weekly tracking</h3><p class="sub">Weeks run Monday to Sunday. Your routine targets and historical changes are retained.</p><button class="secondary wide" data-modal="reflection">Write this week's reflection</button></div><div class="card stack"><h3>About</h3><p class="sub">Aaron’s Best Life · Version 1.8 · Private, offline-capable PWA</p></div></div>`}
function render(){document.getElementById('app').innerHTML=({home,category,checkin,stats,settings}[view]||home)()+nav();wire();}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),2600)}
function doAdjust(id,n){let r=db.routines.find(r=>r.id===id);if(!r)return;if(n>0){db.completions.push({id:makeId(),rid:id,date:today(),at:Date.now()});let x=single(r);if(x.c===x.t)toast('Weekly target complete!');else toast('Great work — progress recorded!')}else{let i=db.completions.findLastIndex(c=>c.rid===id&&c.date===today());if(i<0){toast('Nothing to undo today');return}db.completions.splice(i,1);toast('Today’s latest completion undone')}save();render()}
function showModal(html){document.querySelector('dialog')?.remove();let d=document.createElement('dialog');d.innerHTML=html;document.body.appendChild(d);d.showModal();d.addEventListener('click',e=>{if(e.target===d)d.close()});d.addEventListener('close',()=>d.remove());return d}
function showQuote(){let q=miniQuote();let d=showModal(`<div class="stack"><div class="eyebrow">✨ A THOUGHT FOR TODAY</div><h2>Today's inspiration</h2><p class="quote">“${escape(q.text)}”</p><p class="sub">${escape(q.author)}</p><button class="primary wide" id="quoteClose">Let's make today count</button></div>`);d.querySelector('#quoteClose').onclick=()=>d.close()}
function routineModal(id=null,area=selected){let r=id?db.routines.find(r=>r.id===id):null;let days=r?.days||[];let d=showModal(`<form id="routineForm" class="stack"><h2>${r?'Edit':'Create'} routine</h2><div><label class="label" for="name">What would you like to do?</label><input id="name" class="field" type="text" inputmode="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="next" maxlength="100" required placeholder="e.g. Meditate for 10 minutes" value="${escape(r?.name||'')}"></div><div><label class="label" for="target">How many times per week?</label><input id="target" type="number" min="1" max="35" class="field" required value="${r?.target||3}"></div><div><label class="label">Preferred days (optional)</label><div class="days">${['M','T','W','T','F','S','S'].map((x,i)=>`<button type="button" class="day ${days.includes(i)?'active':''}" data-day="${i}">${x}</button>`).join('')}</div></div><div><label class="label" for="notes">Notes (optional)</label><textarea class="field" id="notes" rows="2" placeholder="A quick detail to keep in mind">${escape(r?.notes||'')}</textarea></div><button class="primary wide" type="submit">Save routine</button>${r?'<button class="secondary wide danger" id="delete" type="button">Archive or delete routine</button>':''}<button class="ghost wide" type="button" id="cancel">Cancel</button></form>`);const nameInput=d.querySelector('#name');nameInput.style.caretColor='#16b889';nameInput.style.webkitTextFillColor='currentColor';nameInput.addEventListener('input',()=>{nameInput.setAttribute('value',nameInput.value)});requestAnimationFrame(()=>{nameInput.focus({preventScroll:true})});d.querySelector('#cancel').onclick=()=>d.close();d.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>b.classList.toggle('active'));d.querySelector('#routineForm').onsubmit=e=>{e.preventDefault();let name=d.querySelector('#name').value.trim(),target=Number(d.querySelector('#target').value);if(!name||!Number.isInteger(target)||target<1||target>35)return toast('Please enter a valid routine and target');let days=[...d.querySelectorAll('.day.active')].map(b=>Number(b.dataset.day));if(r){r.name=name;r.notes=d.querySelector('#notes').value.trim();r.days=days;if(r.target!==target){r.history=[...(r.history||[{from:r.created,target:r.target}]),{from:today(),target}];r.target=target}}else db.routines.push({id:makeId(),created:today(),area,name,target,history:[{from:today(),target}],days,notes:d.querySelector('#notes').value.trim()});save();d.close();view='category';selected=r?.area||area;render();toast(r?'Routine updated':'Your new routine is ready!')};if(r)d.querySelector('#delete').onclick=()=>{if(confirm('Archive this routine? Its history will remain in your statistics.')){r.archived=today();save();d.close();render();toast('Routine archived')}}}
function textModal(type){let w=weekStart(today()),isI=type==='intention';let val=isI?db.intentions[w]||'':db.reflections[w]||{};let d=showModal(`<form id="textForm" class="stack"><h2>${isI?'🎯 Weekly intention':'✍ Weekly reflection'}</h2><p class="sub">Week of ${dateFmt(w)}</p>${isI?`<label class="label">What matters most this week?</label><textarea class="field" id="intent" rows="4" maxlength="800" placeholder="Be present, patient and intentional...">${escape(val)}</textarea>`:`<label class="label">What went well?</label><textarea class="field" id="good" rows="3" maxlength="800">${escape(val.good||'')}</textarea><label class="label">What could I do differently?</label><textarea class="field" id="improve" rows="3" maxlength="800">${escape(val.improve||'')}</textarea>`}<button class="primary wide">Save</button><button class="ghost wide" type="button" id="cancel">Cancel</button></form>`);d.querySelector('#cancel').onclick=()=>d.close();d.querySelector('#textForm').onsubmit=e=>{e.preventDefault();if(isI)db.intentions[w]=d.querySelector('#intent').value.trim();else db.reflections[w]={good:d.querySelector('#good').value.trim(),improve:d.querySelector('#improve').value.trim()};save();d.close();render();toast('Saved successfully')}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`aarons-best-life-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importData(file){try{let data=JSON.parse(await file.text());if(!Array.isArray(data.routines)||!Array.isArray(data.completions)||!data.settings)throw Error('Invalid format');if(!confirm('Replace all existing app data with this backup?'))return;db=data;db.settings=db.settings||{};if(!['dark','light'].includes(db.settings.theme))db.settings.theme='dark';applyTheme();save();view='home';render();toast('Backup restored successfully')}catch(e){toast('Import failed: please select a valid backup')}}
function sound(){try{let c=new(window.AudioContext||window.webkitAudioContext)();[0,0.18,0.36].forEach((delay,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=[523,659,784][i];o.connect(g);g.connect(c.destination);let t=c.currentTime+delay;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.start(t);o.stop(t+.17)})}catch(e){toast('Sound unavailable')}}
function navigate(next){if(view===next)return;history.pushState({view:next,selected},'', '#'+next+(next==='category'?'-'+selected:''));view=next;render();document.scrollingElement?.scrollTo(0,0)};
window.addEventListener('popstate',e=>{view=e.state?.view||'home';selected=e.state?.selected||'fitness';render();document.scrollingElement?.scrollTo(0,0)});
// Android owns its system back swipe. Do not intercept touch events: that interferes with scrolling.
function wire(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{navigate(b.dataset.nav)});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{selected=b.dataset.area;navigate('category')});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>routineModal(null,b.dataset.add));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>routineModal(b.dataset.edit));document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>doAdjust(b.dataset.id,Number(b.dataset.adjust)));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>textModal(b.dataset.modal));document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{db.settings.theme=b.dataset.theme;applyTheme();save();document.querySelectorAll('[data-theme]').forEach(el=>{const active=el.dataset.theme===db.settings.theme;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active))})}));document.querySelector('#reminder')?.addEventListener('change',e=>{db.settings.reminder=e.target.checked;save()});document.querySelector('#testSound')?.addEventListener('click',sound);document.querySelector('#export')?.addEventListener('click',exportData);document.querySelector('#import')?.addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0])})}
// In-app alert only: browsers cannot guarantee scheduled local sounds when the PWA is closed.
let reminded='';setInterval(()=>{let now=new Date(),d=today();if(db.settings.reminder&&now.getHours()===21&&reminded!==d&&document.visibilityState==='visible'){reminded=d;sound();toast('🌙 It’s 9 pm — check in with your routines!')}},30_000);
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});history.replaceState({view:'home',selected},'',location.pathname);render();
})();
</script></body></html>
